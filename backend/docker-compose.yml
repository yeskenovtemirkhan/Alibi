services:
  db:
    image: postgres:16-alpine
    container_name: alibi-postgres
    environment:
      POSTGRES_USER: alibi
      POSTGRES_PASSWORD: alibi
      POSTGRES_DB: alibi
    ports:
      - "5433:5432"
    volumes:
      - alibi-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alibi -d alibi"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  alibi-pgdata:
